<style>
:root{
  --bg:#eef0ea; --panel:#f8f9f5; --panel2:#eef1e9; --ink:#242b2b; --muted:#5f6a67; --line:#d2d8cc;
  --land:#e4e9dd; --land-stroke:#8d9684; --water:#a3c2d1; --road:#bcc3b4; --hills:#ccd6c2;
  --clubs:#2668a2; --sdlink:#c85a1f; --pdarc:#2e8757; --bh:#7a5fae; --indep:#7c8680;
  --accent:#c85a1f; --danger:#b3452f; --ok:#2e8757;
  --chip-bg:#e7eae1; --shadow:0 6px 24px rgba(30,40,35,.14);
  --discord:#5865F2; --discord-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161a; --panel:#1a2027; --panel2:#151b21; --ink:#e2e8e4; --muted:#94a19c; --line:#2b333b;
    --land:#1d242c; --land-stroke:#4d5c68; --water:#1d3644; --road:#333e48; --hills:#26303a;
    --clubs:#5ea3d8; --sdlink:#eb8a4a; --pdarc:#54b384; --bh:#a78ce0; --indep:#8b9791;
    --accent:#eb8a4a; --danger:#e07a5f; --ok:#54b384;
    --chip-bg:#242c34; --shadow:0 6px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#12161a; --panel:#1a2027; --panel2:#151b21; --ink:#e2e8e4; --muted:#94a19c; --line:#2b333b;
  --land:#1d242c; --land-stroke:#4d5c68; --water:#1d3644; --road:#333e48; --hills:#26303a;
  --clubs:#5ea3d8; --sdlink:#eb8a4a; --pdarc:#54b384; --bh:#a78ce0; --indep:#8b9791;
  --accent:#eb8a4a; --danger:#e07a5f; --ok:#54b384;
  --chip-bg:#242c34; --shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Barlow,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:60px}
.mono{font-family:"IBM Plex Mono",Consolas,monospace}

/* ── nav ── */
#nav{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#brand{display:flex;align-items:baseline;gap:10px}
#brand h1{margin:0;font:700 26px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;text-transform:uppercase}
#brand .sub{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#nav .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.discord{background:var(--discord);border-color:var(--discord);color:var(--discord-ink)}
.btn.discord svg{flex:none}

/* ── layout ── */
#stage{position:relative;height:calc(100dvh - var(--chrome,54px));display:flex}
#mapwrap{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px}
svg#map{width:100%;height:100%;max-height:100%;touch-action:none}
svg#map text{user-select:none}
#zoomctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoomctl button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);font-size:19px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center}
#zoomctl button:hover{border-color:var(--muted)}

/* ── legend ── */
#legend{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 14px;font-size:13.5px;max-width:250px}
#legend h3{margin:0 0 6px;font:600 13px "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#legend label{display:flex;align-items:center;gap:8px;padding:2.5px 0;cursor:pointer}
#legend input{width:auto}
.swatch{width:12px;height:12px;border-radius:50%;flex:none}
.swatch.club{border-radius:2px;transform:rotate(45deg)}

/* ── drawer ── */
#drawer{flex:0 0 min(400px,38%);width:auto;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;z-index:20}
#drawer .head,#drawer .body{min-width:280px}
#drawer.empty #closeDrawer{display:none}
#drawer .head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px 10px;z-index:2}
#drawer .head h2{margin:0;font:600 24px/1.1 "Barlow Condensed",sans-serif}
#drawer .head .call{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--accent);font-weight:600}
#drawer .head .kind{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#closeDrawer{position:absolute;top:10px;right:10px;font-size:20px;line-height:1;padding:6px 10px;border-radius:8px}
#closeDrawer:hover{background:var(--panel2)}
#drawer .body{padding:14px 18px 30px;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.field .val{white-space:pre-wrap}
.field .val a{color:var(--clubs)}
.field .val:empty::after{content:"—";color:var(--muted)}
.rpt{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--panel2)}
.rpt .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rpt .name{font-weight:600}
.rpt .freqs{font-family:"IBM Plex Mono",monospace;font-size:13.5px;margin-top:3px}
.sitehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.linklike{color:var(--clubs);font-weight:600;padding:0;text-align:left}
.linklike:hover{text-decoration:underline}
.chip{font-size:11px;font-weight:600;letter-spacing:.05em;padding:1.5px 8px;border-radius:20px;background:var(--chip-bg);color:var(--muted)}
.chip.vhf{color:var(--ok)} .chip.uhf{color:var(--clubs)} .chip.link{color:var(--accent)} .chip.dig{color:var(--bh)}
.photo{width:100%;border-radius:8px;display:block}
.clublogo{display:block;max-width:100%;max-height:150px;object-fit:contain;background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line)}
.btn.small{padding:4px 10px;font-size:13px}
.sysnote{font-size:13px;color:var(--muted)}
.drawer-note{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* ── map marks ── */
.site-dot{stroke:var(--panel);stroke-width:1.6}
.club-dot{stroke:var(--panel);stroke-width:1.6}
.mark{cursor:pointer}
.mark text{font:600 12.5px Barlow,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.mark text.cnum{font:700 12px Barlow,sans-serif;fill:#fff;stroke:none;paint-order:normal}
.linkline{fill:none;stroke-width:2.2;stroke-linecap:round;opacity:.85;cursor:pointer}
.linkline.halo{stroke-width:9;opacity:0;}
.mark.selected .site-dot,.mark.selected .club-dot{stroke:var(--ink);stroke-width:2.4}
#map .citylabel{font:500 10.5px Barlow,sans-serif;font-size:calc(10.5px*var(--cityf,1));fill:var(--muted)}
#map .statelabel{font:700 34px "Barlow Condensed",sans-serif;font-size:calc(34px*var(--statef,1));fill:var(--land-stroke);opacity:.5;letter-spacing:.35em}

@media (max-width:700px){
  #drawer{position:absolute;left:0;right:0;bottom:0;top:auto;height:62%;width:100%;flex:none;border-left:0;border-top:1px solid var(--line);box-shadow:var(--shadow);transform:translateY(103%);transition:transform .22s ease;overflow-y:auto}
  #drawer.open{transform:none;width:100%}
  #drawer .head,#drawer .body{min-width:0}
  #legend{max-width:170px;font-size:12.5px;bottom:10px;left:10px}
  #brand .sub{display:none}
}
@media (prefers-reduced-motion: reduce){#drawer{transition:none}}
</style>

}]},{"id":"s29","name":"Custer","system":"none","lat":43.767,"lon":-103.599,"notes":"K0HS — downtown Custer.","photos":[],"repeaters":[{"label":"K0HS VHF","type":"VHF Repeater","tx":"147.090","rx":"147.690","tone":"146.2"}]},{"id":"s30","name":"Pay Dirt","system":"none","lat":43.78,"lon":-103.7,"notes":"K0HS — west of Custer.","photos":[],"repeaters":[{"label":"K0HS VHF","type":"VHF Repeater","tx":"147.150","rx":"147.750","tone":"146.2"}]},{"id":"s31","name":"Bear Mountain (K0HS 6m)","system":"none","lat":43.872,"lon":-103.742,"notes":"K0HS — north of Custer.","photos":[],"repeaters":[{"label":"K0HS 6 Meter","type":"6m","tx":"53.170","rx":"52.170","tone":"146.2 (encode only)"}]},{"id":"s32","name":"Edgemont (GMRS)","system":"none","lat":43.3,"lon":-103.827,"notes":"K0HS-listed GMRS machine.","photos":[],"repeaters":[{"label":"Edgemont GMRS","type":"GMRS","tx":"462.550","rx":"467.550","tone":"141.3"}]}],"links":[{"a":"s4","b":"s1","system":"sdlink"},{"a":"s4","b":"s2","system":"sdlink"},{"a":"s4","b":"s3","system":"sdlink"},{"a":"s4","b":"s5","system":"sdlink"},{"a":"s4","b":"s7","system":"sdlink"},{"a":"s5","b":"s6","system":"sdlink"},{"a":"s7","b":"s8","system":"sdlink"},{"a":"s7","b":"s9","system":"sdlink"},{"a":"s9","b":"s10","system":"sdlink"},{"a":"s10","b":"s11","system":"sdlink"},{"a":"s10","b":"s12","system":"sdlink"},{"a":"s12","b":"s13","system":"sdlink"},{"a":"s13","b":"s14","system":"sdlink"},{"a":"s15","b":"s16","system":"pdarc"},{"a":"s15","b":"s17","system":"pdarc"},{"a":"s17","b":"s18","system":"pdarc"},{"a":"s19","b":"s20","system":"bh"},{"a":"s20","b":"s22","system":"bh"}]}</script>

<script>
"use strict";
/* ───────────────────────── state ───────────────────────── */
const seedEl = document.getElementById('seed');
let state = JSON.parse(seedEl.textContent);
// The site is read-only everywhere: on static hosting (605hams.com) it renders
// data.json from the repo (edit that file to update the map); inside the Claude
// artifact viewer it renders the embedded seed.
const IS_ARTIFACT = !!(window.claude && window.claude.use);
const DATA_PATH = 'data.json';
let selected = null;               // {type:'club'|'site'|'link'|'cluster', id/index/key}
const layers = {clubs:true, sdlink:true, pdarc:true, bh:true, none:true};
const SYS = {
  sdlink:{name:'SD-LINK', color:'var(--sdlink)'},
  pdarc:{name:'Prairie Dog ARC', color:'var(--pdarc)'},
  bh:{name:'Northern Hills', color:'var(--bh)'},
  none:{name:'Independent', color:'var(--indep)'}
};
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ───────────────────────── projection ───────────────────────── */
const LON0=-104.06, LON1=-96.40, LAT0=42.42, LAT1=45.97;
const K = Math.cos(44.2*Math.PI/180);
const S = 1000/((LON1-LON0)*K);
const H = (LAT1-LAT0)*S;
const px = (lat,lon)=>[(lon-LON0)*K*S, (LAT1-lat)*S];
const inv = (x,y)=>[LAT1 - y/S, LON0 + x/(K*S)];
const pts = a => a.map(p=>px(p[0],p[1]).map(n=>n.toFixed(1)).join(',')).join(' ');

/* ───────────────────────── base map geometry ───────────────────────── */
const BORDER = [[45.945,-104.05],[45.945,-102.0],[45.945,-99.5],[45.94,-97.5],[45.935,-96.563],
 [45.75,-96.69],[45.59,-96.83],[45.44,-96.62],[45.30,-96.47],[44.5,-96.453],[43.85,-96.453],[43.50,-96.453],
 [43.30,-96.53],[43.13,-96.45],[42.90,-96.55],[42.70,-96.62],[42.52,-96.50],[42.49,-96.44],
 [42.60,-96.72],[42.77,-96.95],[42.83,-97.22],[42.86,-97.40],[42.80,-97.65],[42.72,-97.90],[42.77,-98.10],
 [42.85,-98.30],[42.92,-98.42],[43.00,-98.50],[43.00,-100.5],[43.00,-102.5],[43.00,-104.05]];
const MISSOURI = [[45.94,-100.32],[45.55,-100.42],[45.10,-100.30],[44.75,-100.50],[44.45,-100.40],[44.365,-100.37],
 [44.15,-100.20],[44.05,-99.85],[44.02,-99.45],[43.80,-99.32],[43.55,-99.20],[43.30,-99.05],[43.10,-98.70],[43.00,-98.50]];
const I90 = [[43.54,-96.75],[43.65,-97.60],[43.71,-98.03],[43.81,-99.33],[43.89,-100.71],[43.83,-101.51],
 [43.99,-102.24],[44.08,-103.23],[44.41,-103.51],[44.49,-103.86],[44.55,-104.05]];
const I29 = [[42.49,-96.48],[43.00,-96.58],[43.54,-96.73],[44.31,-96.77],[44.90,-97.10],[45.66,-96.99],[45.94,-96.92]];
const CITIES = [["Aberdeen",45.465,-98.487],["Mitchell",43.71,-98.03],["Spearfish",44.49,-103.86],["Mobridge",45.54,-100.43],["Chamberlain",43.81,-99.33]];
let cityObstacles = [];

const svg = document.getElementById('map');

/* ── zoom / pan ── */
const VB0={x:-24,y:-24,w:1048,h:700};
let view={x:VB0.x,y:VB0.y,w:VB0.w,h:VB0.h}, zoom=1;
// screenScale: how many CSS pixels one map unit currently paints as
function screenScale(){ const m=svg.getScreenCTM(); return m?m.a:1; }
function syncLabelVars(){
  const k=screenScale(); if(!k) return;
  // city labels: constant device px at zoom 1, gentle growth with zoom
  svg.style.setProperty('--cityf',(Math.pow(zoom,0.35)/k).toFixed(4));
  // state watermark: map-proportional but tamed as zoom rises
  svg.style.setProperty('--statef',Math.pow(zoom,-0.65).toFixed(4));
}
function applyView(){
  svg.setAttribute('viewBox',view.x+' '+view.y+' '+view.w+' '+view.h);
  syncLabelVars();
}
function setView(x,y){
  view.x=Math.min(Math.max(x,VB0.x),VB0.x+VB0.w-view.w);
  view.y=Math.min(Math.max(y,VB0.y),VB0.y+VB0.h-view.h);
  applyView();
}
function setZoom(z,cx,cy){          // cx,cy: map point to hold fixed
  z=Math.min(10,Math.max(1,z));
  const w=VB0.w/z, h=VB0.h/z;
  const x=cx-(cx-view.x)*(w/view.w), y=cy-(cy-view.y)*(h/view.h);
  const changed=Math.abs(z-zoom)>1e-9;
  view.w=w; view.h=h; zoom=z; setView(x,y);
  if(changed) render();             // labels re-place at the new scale
}

function baseMap(){
  let g = '<g id="base">';
  g += '<polygon points="'+pts(BORDER)+'" fill="var(--land)" stroke="var(--land-stroke)" stroke-width="2" stroke-linejoin="round"/>';
  g += '<polyline points="'+pts(I90)+'" stroke="var(--road)" stroke-width="2" fill="none" stroke-dasharray="7 5"/>';
  g += '<polyline points="'+pts(I29)+'" stroke="var(--road)" stroke-width="2" fill="none" stroke-dasharray="7 5"/>';
  g += '<polyline points="'+pts(MISSOURI)+'" stroke="var(--water)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  const [slx,sly]=px(45.55,-102.6);
  g += '<text class="statelabel" x="'+slx+'" y="'+sly+'">SOUTH DAKOTA</text>';
  cityObstacles=[];
  for(const c of CITIES){
    const [x,y]=px(c[1],c[2]);
    g += '<circle cx="'+x+'" cy="'+y+'" r="2.2" fill="var(--land-stroke)"/><text class="citylabel" x="'+(x+5)+'" y="'+(y+3)+'">'+c[0]+'</text>';
    cityObstacles.push([x-3,y-3,6,6],[x+5,y-6,c[0].length*5.4+4,12]);
  }
  g += '</g><g id="glinks"></g><g id="gmarks"></g>';
  svg.innerHTML = g;
}

/* ───────────────────────── dynamic render ───────────────────────── */
const site = id => state.sites.find(s=>s.id===id);
const club = id => state.clubs.find(c=>c.id===id);

function overlapArea(a,b){
  const w=Math.min(a[0]+a[2],b[0]+b[2])-Math.max(a[0],b[0]);
  const h=Math.min(a[1]+a[3],b[1]+b[3])-Math.max(a[1],b[1]);
  return (w>0&&h>0)?w*h:0;
}
// Try above/below/right/left of the marker; take the first spot free of
// already-placed labels, city names, marker dots, and the map edge —
// else least overlap. Returned dir drives the marker's stem line.
const MAPBOX=[-22,-22,1044,696];
// sc = 1/zoom: markers render inside a scale(sc) group so dots keep constant
// screen size. g = zoom^0.35: labels grow gently as you zoom in, so text stays
// readable against the expanding map. tx/ty are local coords, boxes global.
function placeLabel(x,y,text,pref,obstacles,sc,g){
  const w=(text.length*7.3+7)*g, h=16*g;
  const C=(dir,tx,ty,anchor)=>{
    const bx = anchor==='middle'?tx-w/2 : anchor==='start'?tx-1 : tx-w+1;
    return {dir,tx,ty,anchor,box:[x+bx*sc,y+(ty-11*g)*sc,w*sc,h*sc]};
  };
  const above=C('above',0,-17*g,'middle');
  const below=C('below',0,22*g,'middle');
  const right=C('right',13*g,4*g,'start');
  const left=C('left',-13*g,4*g,'end');
  const diag=[C('right',12*g,-11*g,'start'),C('right',12*g,18*g,'start'),
              C('left',-12*g,-11*g,'end'),C('left',-12*g,18*g,'end')];
  const cands = (pref==='above'?[above,below,right,left]:[below,above,right,left]).concat(diag);
  let best=cands[0], bestA=Infinity;
  for(const c of cands){
    let a=obstacles.reduce((t,o)=>t+overlapArea(c.box,o),0);
    a += (c.box[2]*c.box[3]-overlapArea(c.box,MAPBOX))*4;   // heavy penalty for going off-map
    if(a===0){ best=c; bestA=0; break; }
    if(a<bestA){ best=c; bestA=a; }
  }
  // no clean spot and the residual collision is visually significant (>60 device
  // px²): hide this label — the marker stays, and the label returns on zoom-in
  best.hide = bestA/(sc*sc) > 60;
  if(!best.hide) obstacles.push(best.box);
  return best;
}
const STEMS={above:[0,-7,0,-13], below:[0,7,0,13], right:[7,0,13,0], left:[-7,0,-13,0]};

let lastClusters=[];
const clusterKey = m => m.map(s=>s.id).sort().join('|');
function render(){
  // sc: marker group scale so 1 local unit = 1 CSS pixel, on any screen size
  const sc = 1/(screenScale()||1), lg = Math.pow(zoom,0.35);
  const fs = ' style="font-size:'+(12.5*lg).toFixed(2)+'px"';
  syncLabelVars();
  const visSites = state.sites.filter(s=>layers[s.system||'none']);
  const visClubs = layers.clubs?state.clubs:[];

  // group sites that sit on top of each other at this zoom into one node
  const thresh = 26*sc;
  const clusters=[];
  for(const s of visSites){
    const [x,y]=px(s.lat,s.lon);
    const c=clusters.find(c=>Math.hypot(c.x-x,c.y-y)<thresh);
    if(c){
      c.members.push(s);
      c.x=c.members.reduce((t,m)=>t+px(m.lat,m.lon)[0],0)/c.members.length;
      c.y=c.members.reduce((t,m)=>t+px(m.lat,m.lon)[1],0)/c.members.length;
    } else clusters.push({x,y,members:[s]});
  }
  lastClusters=clusters;
  const pos={};                                  // siteId → rendered position
  for(const c of clusters) for(const m of c.members) pos[m.id]=[c.x,c.y];

  // links (endpoints snap to cluster nodes; hide links inside one cluster)
  let lh='';
  state.links.forEach((L,i)=>{
    const a=site(L.a), b=site(L.b);
    if(!a||!b||!layers[L.system||'none']||!pos[L.a]||!pos[L.b]) return;
    const [x1,y1]=pos[L.a], [x2,y2]=pos[L.b];
    if(Math.hypot(x1-x2,y1-y2)<1) return;
    const col=(SYS[L.system]||SYS.none).color;
    lh += '<line class="linkline halo" data-link="'+i+'" vector-effect="non-scaling-stroke" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'"/>';
    lh += '<line class="linkline" data-link="'+i+'" vector-effect="non-scaling-stroke" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'"'+(selected&&selected.type==='link'&&selected.id===i?' stroke-width="4" opacity="1"':'')+'/>';
  });
  document.getElementById('glinks').innerHTML = lh;

  // markers — collect dot obstacles first, then place labels greedily
  const obstacles = cityObstacles.slice();
  for(const c of clusters){
    const r=c.members.length>1?13:8;
    obstacles.push([c.x-r*sc,c.y-(r+6)*sc,2*r*sc,(2*r+6)*sc]);
  }
  for(const c of visClubs){ const [x,y]=px(c.lat,c.lon); obstacles.push([x-8*sc,y-8*sc,16*sc,16*sc]); }
  let mh='';
  clusters.forEach((c,ci)=>{
    if(c.members.length===1){
      const s=c.members[0];
      const col=(SYS[s.system]||SYS.none).color;
      const sel = selected&&selected.type==='site'&&selected.id===s.id;
      const L=placeLabel(c.x,c.y,s.name,'above',obstacles,sc,lg);
      const st=STEMS[L.dir];
      mh += '<g class="mark'+(sel?' selected':'')+'" data-site="'+s.id+'" tabindex="0" role="button" aria-label="'+esc(s.name)+' repeater site" transform="translate('+c.x+','+c.y+') scale('+sc+')">'
          + '<circle class="site-dot" r="7" fill="'+col+'"/>'
          + (L.hide?'':'<line x1="'+st[0]+'" y1="'+st[1]+'" x2="'+st[2]+'" y2="'+st[3]+'" stroke="'+col+'" stroke-width="2"/>'
          + '<text'+fs+' x="'+L.tx.toFixed(1)+'" y="'+L.ty.toFixed(1)+'" text-anchor="'+L.anchor+'">'+esc(s.name)+'</text>')+'</g>';
    } else {
      const systems=[...new Set(c.members.map(m=>m.system||'none'))];
      const col=systems.length===1?(SYS[systems[0]]||SYS.none).color:'var(--indep)';
      const label=c.members[0].name+' +'+(c.members.length-1);
      const sel = selected&&selected.type==='cluster'&&selected.key===clusterKey(c.members);
      const L=placeLabel(c.x,c.y,label,'above',obstacles,sc,lg);
      mh += '<g class="mark'+(sel?' selected':'')+'" data-cluster="'+ci+'" tabindex="0" role="button" aria-label="'+esc(label)+', '+c.members.length+' repeater sites" transform="translate('+c.x+','+c.y+') scale('+sc+')">'
          + '<circle class="site-dot" r="12" fill="'+col+'"/>'
          + '<text class="cnum" y="4.5" text-anchor="middle">'+c.members.length+'</text>'
          + (L.hide?'':'<text'+fs+' x="'+L.tx.toFixed(1)+'" y="'+L.ty.toFixed(1)+'" text-anchor="'+L.anchor+'">'+esc(label)+'</text>')+'</g>';
    }
  });
  for(const c of visClubs){
    const [x,y]=px(c.lat,c.lon);
    const sel = selected&&selected.type==='club'&&selected.id===c.id;
    const L=placeLabel(x,y,c.callsign,'below',obstacles,sc,lg);
    mh += '<g class="mark'+(sel?' selected':'')+'" data-club="'+c.id+'" tabindex="0" role="button" aria-label="'+esc(c.name)+'" transform="translate('+x+','+y+') scale('+sc+')">'
        + '<rect class="club-dot" x="-5.5" y="-5.5" width="11" height="11" rx="2" transform="rotate(45)" fill="var(--clubs)"/>'
        + (L.hide?'':'<text'+fs+' x="'+L.tx.toFixed(1)+'" y="'+L.ty.toFixed(1)+'" text-anchor="'+L.anchor+'">'+esc(c.callsign)+'</text>')+'</g>';
  }
  document.getElementById('gmarks').innerHTML = mh;
}

/* ───────────────────────── drawer ───────────────────────── */
const drawer=document.getElementById('drawer');
const dKind=document.getElementById('dKind'), dTitle=document.getElementById('dTitle'),
      dCall=document.getElementById('dCall'), dBody=document.getElementById('dBody');

function closeDrawer(){ selected=null; drawer.classList.remove('open'); renderEmptyDrawer(); render(); }
document.getElementById('closeDrawer').onclick = closeDrawer;
function renderEmptyDrawer(){
  drawer.classList.add('empty');
  dKind.textContent='South Dakota Amateur Radio';
  dTitle.textContent='Explore the map';
  dCall.textContent='';
  dBody.innerHTML=
    '<div class="sysnote">Click a <b>club</b> (blue diamond) or <b>repeater site</b> (colored dot) to see details — meeting times, frequencies, tones, and site photos.</div>'+
    '<div class="sysnote">Colored lines connect repeaters that are RF-linked into a system, and numbered circles group several sites at one location — click them to see everything there. Use the legend to show or hide layers.</div>'+
    '<div class="sysnote">Scroll or pinch to zoom, drag to pan, and use the buttons in the corner of the map.</div>';
}

function field(lab, val, link){
  let v = esc(val);
  if(link && val){ const href=/^https?:/.test(val)?val:'https://'+val; v='<a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(val)+'</a>'; }
  return '<div class="field"><label>'+lab+'</label><div class="val">'+v+'</div></div>';
}
function chipFor(t){
  t=(t||'').toLowerCase();
  if(t.includes('digital')||t.includes('fusion')) return '<span class="chip dig">DIGITAL</span>';
  if(t.includes('link')) return '<span class="chip link">LINK</span>';
  if(t.includes('vhf')) return '<span class="chip vhf">VHF</span>';
  if(t.includes('uhf')) return '<span class="chip uhf">UHF</span>';
  return '<span class="chip">'+esc(t.toUpperCase()||'RPT')+'</span>';
}
function rptView(r){
  const f=[];
  if(r.tx) f.push('TX '+r.tx); if(r.rx) f.push('RX '+r.rx);
  let s='<div class="rpt"><div class="top"><span class="name">'+esc(r.label)+'</span>'+chipFor(r.type)+'</div>';
  s+='<div class="freqs">'+(f.length?esc(f.join('  /  ')):'<span style="color:var(--muted)">frequency not set</span>');
  if(r.tone) s+='  ·  Tone '+esc(r.tone);
  s+='</div></div>';
  return s;
}
function openClub(id){
  const c=club(id); if(!c) return;
  selected={type:'club',id}; drawer.classList.add('open'); drawer.classList.remove('empty');
  dKind.textContent='Amateur Radio Club'; dTitle.textContent=c.name; dCall.textContent=c.callsign+' · '+c.city;
  const dUrl=c.discord?(/^https?:/.test(c.discord)?c.discord:'https://'+c.discord):'';
  dBody.innerHTML =
    (c.logo?'<img class="clublogo" src="'+esc(c.logo)+'" alt="'+esc(c.name)+' logo" onerror="this.remove()">':'') +
    field('Meetings', c.meeting) +
    field('Mailing list', c.mailing, true) +
    field('Website', c.website, true) +
    (dUrl?'<div class="field"><label>Discord</label><a class="btn discord small" style="display:inline-flex;margin-top:2px" href="'+esc(dUrl)+'" target="_blank" rel="noopener"><svg width="16" height="12" viewBox="0 0 127 96" fill="currentColor" aria-hidden="true"><use href="#dicon"/></svg>Join the club Discord</a></div>':'') +
    field('Repeaters maintained', c.repeaters) +
    (c.notes?field('Notes',c.notes):'') +
    '<div class="drawer-note">Coordinates: '+c.lat.toFixed(4)+', '+c.lon.toFixed(4)+'</div>';
  render();
}

function openSite(id){
  const s=site(id); if(!s) return;
  selected={type:'site',id}; drawer.classList.add('open'); drawer.classList.remove('empty');
  const sys=SYS[s.system]||SYS.none;
  dKind.textContent='Repeater Site — '+sys.name; dTitle.textContent=s.name; dCall.textContent='';
  const photos = (s.photos||[]).map(p=>'<div><img class="photo" src="'+p+'" alt="Site photo"></div>').join('');
  dBody.innerHTML =
    (s.repeaters||[]).map(rptView).join('') +
    (s.notes?field('Notes',s.notes):'') +
    photos +
    '<div class="drawer-note">Coordinates: '+s.lat.toFixed(4)+', '+s.lon.toFixed(4)+'</div>';
  render();
}

function openCluster(ci){
  const c=lastClusters[ci]; if(!c) return;
  selected={type:'cluster',key:clusterKey(c.members)}; drawer.classList.add('open'); drawer.classList.remove('empty');
  dKind.textContent='Repeater location — '+c.members.length+' sites';
  dTitle.textContent=c.members[0].name+' area'; dCall.textContent='';
  dBody.innerHTML = c.members.map(m=>{
    const sys=SYS[m.system]||SYS.none;
    return '<div class="sitehead"><button class="linklike" data-open-site="'+m.id+'">'+esc(m.name)+'</button>'
         + '<span class="chip" style="color:'+sys.color+'">'+esc(sys.name)+'</span></div>'
         + (m.repeaters||[]).map(rptView).join('');
  }).join('') +
  '<div class="drawer-note">These sites sit close together at this zoom — zoom in on the map to separate them, or click a site name for its full details.</div>';
  dBody.querySelectorAll('[data-open-site]').forEach(b=>b.onclick=()=>openSite(b.getAttribute('data-open-site')));
  render();
}

function openLink(i){
  const L=state.links[i]; if(!L) return;
  selected={type:'link',id:i}; drawer.classList.add('open'); drawer.classList.remove('empty');
  const a=site(L.a),b=site(L.b);
  dKind.textContent='Repeater link'; dTitle.textContent=(a?a.name:'?')+' ⌁ '+(b?b.name:'?'); dCall.textContent=(SYS[L.system]||SYS.none).name;
  dBody.innerHTML='<div class="sysnote">This line marks an RF link between the two sites in the '+(SYS[L.system]||SYS.none).name+' system.</div>';
  render();
}

/* ───────────────────────── map interaction ───────────────────────── */
function svgPoint(ev){
  const pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  return [p.x,p.y];
}
let justDragged=false, pan=null, pinch=null;
const ptrs=new Map();
function openMark(g){
  if(g.hasAttribute('data-site')) openSite(g.getAttribute('data-site'));
  else if(g.hasAttribute('data-club')) openClub(g.getAttribute('data-club'));
  else if(g.hasAttribute('data-cluster')) openCluster(+g.getAttribute('data-cluster'));
}
svg.addEventListener('pointerdown',ev=>{
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(ptrs.size===2){                       // second finger → pinch zoom
    pan=null;
    const [a,b]=[...ptrs.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};
    for(const id of ptrs.keys()){ try{ svg.setPointerCapture(id); }catch(e){} }
    return;
  }
  // a press anywhere can become a pan; if it never moves, it's a click
  pan={sx:ev.clientX, sy:ev.clientY, vx:view.x, vy:view.y, scale:svg.getScreenCTM().a, moved:false,
       hit:ev.target.closest('.mark')};
});
svg.addEventListener('pointermove',ev=>{
  const p=ptrs.get(ev.pointerId); if(p){ p.x=ev.clientX; p.y=ev.clientY; }
  if(pinch && ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d>0 && pinch.d>0){
      const pt=svg.createSVGPoint(); pt.x=(a.x+b.x)/2; pt.y=(a.y+b.y)/2;
      const m=pt.matrixTransform(svg.getScreenCTM().inverse());
      setZoom(zoom*d/pinch.d, m.x, m.y);
    }
    pinch.d=d;
    return;
  }
  if(pan){
    if(!pan.moved && Math.hypot(ev.clientX-pan.sx,ev.clientY-pan.sy)<5) return;
    if(!pan.moved){ try{ svg.setPointerCapture(ev.pointerId); }catch(e){} }    // capture only once panning starts
    pan.moved=true;
    setView(pan.vx-(ev.clientX-pan.sx)/pan.scale, pan.vy-(ev.clientY-pan.sy)/pan.scale);
  }
});
svg.addEventListener('pointerup',ev=>{
  ptrs.delete(ev.pointerId);
  if(pinch){ if(ptrs.size<2){ pinch=null; justDragged=true; } return; }
  if(!pan) return;
  const p=pan; pan=null;
  if(p.moved){ justDragged=true; return; }
  if(p.hit) openMark(p.hit);
});
svg.addEventListener('pointercancel',ev=>{ ptrs.delete(ev.pointerId); pinch=null; pan=null; });
svg.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const [mx,my]=svgPoint(ev);
  setZoom(zoom*(ev.deltaY<0?1.25:0.8), mx, my);
},{passive:false});
document.getElementById('zin').onclick=()=>setZoom(zoom*1.5, view.x+view.w/2, view.y+view.h/2);
document.getElementById('zout').onclick=()=>setZoom(zoom/1.5, view.x+view.w/2, view.y+view.h/2);
document.getElementById('zreset').onclick=()=>{ view={x:VB0.x,y:VB0.y,w:VB0.w,h:VB0.h}; zoom=1; applyView(); render(); };
svg.addEventListener('click',ev=>{
  if(justDragged){ justDragged=false; return; }
  const ln=ev.target.closest('.linkline');
  if(ln){ openLink(+ln.getAttribute('data-link')); return; }
  if(ev.target.closest('.mark')) return;
  closeDrawer();
});
svg.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter'&&ev.key!==' ') return;
  const g=ev.target.closest&&ev.target.closest('.mark'); if(!g) return;
  ev.preventDefault();
  openMark(g);
});

/* ───────────────────────── nav ───────────────────────── */
const discordBtn=document.getElementById('discordBtn');
function syncDiscord(){
  const u=(state.discord&&state.discord.url||'').trim();
  discordBtn.href=u||'#';
  discordBtn.style.display=u?'inline-flex':'none';   // hidden until an invite URL is set in the data
  document.getElementById('discordLabel').textContent=(state.discord&&state.discord.label)||'SD Ham Discord';
}

document.querySelectorAll('#legend [data-layer]').forEach(cb=>cb.addEventListener('change',()=>{
  layers[cb.getAttribute('data-layer')]=cb.checked; render();
}));

function syncChrome(){
  document.documentElement.style.setProperty('--chrome',document.getElementById('nav').offsetHeight+'px');
}
window.addEventListener('resize',()=>{ syncChrome(); render(); });

/* ───────────────────────── boot ───────────────────────── */
if(!IS_ARTIFACT){
  // data.json is the source of truth on static hosting; the embedded seed is the fallback
  fetch(DATA_PATH+'?t='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d&&d.clubs&&d.sites){ state=d; render(); syncDiscord(); } })
    .catch(()=>{});
}
baseMap();
renderEmptyDrawer();
render();
syncDiscord();
syncChrome();
</script>
