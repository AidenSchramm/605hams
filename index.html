<html lang="en">

<title>605 Ham Map | South Dakota amateur radio clubs &amp; repeaters</title>
<meta name="description" content="Interactive map of South Dakota amateur radio clubs and linked repeater systems: SD-LINK, Prairie Dog ARC, and the Northern Hills linked system. Frequencies, tones, meeting times, and club contacts.">

<style>

:root{
  --bg:#eef0ea; --panel:#f8f9f5; --panel2:#eef1e9; --ink:#242b2b; --muted:#5f6a67; --line:#d2d8cc;
  --land:#e4e9dd; --land-stroke:#8d9684; --water:#9dc0d2; --water-line:#8fb6ca; --road:#c2bda8; --county:#c5ccba;
  --clubs:#2668a2; --sdlink:#c85a1f; --pdarc:#2e8757; --nh:#7a5fae; --indep:#7c8680;
  --accent:#c85a1f; --ok:#2e8757; --danger:#b3452f; --warn-bg:#f6e9e3;
  --chip-bg:#e7eae1; --shadow:0 6px 24px rgba(30,40,35,.14);
  --discord:#5865F2; --discord-hi:#4752c4; --discord-ink:#ffffff; --map-pin:#d0552f;
  --plate:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161a; --panel:#1a2027; --panel2:#151b21; --ink:#e2e8e4; --muted:#94a19c; --line:#2b333b;
    --land:#1d242c; --land-stroke:#4d5c68; --water:#1c3a4a; --water-line:#2b5a70; --road:#3d4550; --county:#2c353e;
    --clubs:#5ea3d8; --sdlink:#eb8a4a; --pdarc:#54b384; --nh:#a78ce0; --indep:#8b9791;
    --accent:#eb8a4a; --ok:#54b384; --danger:#e07a5f; --warn-bg:#33231e;
    --chip-bg:#242c34; --shadow:0 6px 24px rgba(0,0,0,.45);
    --discord:#5865F2; --discord-hi:#6b76f5; --map-pin:#eb8a4a;
    --plate:#f2f3ef;
  }
}
:root[data-theme="dark"]{
  --bg:#12161a; --panel:#1a2027; --panel2:#151b21; --ink:#e2e8e4; --muted:#94a19c; --line:#2b333b;
  --land:#1d242c; --land-stroke:#4d5c68; --water:#1c3a4a; --water-line:#2b5a70; --road:#3d4550; --county:#2c353e;
  --clubs:#5ea3d8; --sdlink:#eb8a4a; --pdarc:#54b384; --nh:#a78ce0; --indep:#8b9791;
  --accent:#eb8a4a; --ok:#54b384; --danger:#e07a5f; --warn-bg:#33231e;
  --chip-bg:#242c34; --shadow:0 6px 24px rgba(0,0,0,.45);
  --discord:#5865F2; --discord-hi:#6b76f5; --map-pin:#eb8a4a;
  --plate:#f2f3ef;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
     background:var(--bg);color:var(--ink);font:15px/1.5 Barlow,system-ui,-apple-system,sans-serif;
     -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--clubs)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── nav ── */
#nav{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;
     background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#brand{display:flex;align-items:baseline;gap:10px;min-width:0}
#brand h1{margin:0;font:700 26px/1 "Barlow Condensed","Barlow",sans-serif;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
#brand .sub{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
#nav .spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 15px;border-radius:9px;
     border:1px solid var(--line);background:var(--panel2);font-weight:600;white-space:nowrap;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--muted)}
.btn.small{padding:5px 11px;font-size:13px;border-radius:7px}
.btn.discord{background:var(--discord);border-color:var(--discord);color:var(--discord-ink)}
.btn.discord:hover{background:var(--discord-hi);border-color:var(--discord-hi)}
.btn.discord svg{flex:none}
.btn.maps{display:inline-flex;background:var(--panel2);color:var(--ink)}
.btn.maps svg{flex:none;color:var(--map-pin)}
.btn.maps:hover{border-color:var(--muted)}
#discordBtn{font-size:15px;padding:9px 18px}
#discordBtn .full{display:inline}
#discordBtn .short{display:none}

/* ── layout ── */
#stage{flex:1;min-height:0;position:relative;display:flex}
#mapwrap{flex:1;min-width:0;position:relative}
svg#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
svg#map text{user-select:none}
#zoomctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoomctl button{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font-size:19px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center}
#zoomctl button:hover{border-color:var(--muted)}

/* ── legend ── */
#legend{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);
        border-radius:11px;box-shadow:var(--shadow);font-size:13.5px;max-width:250px;overflow:hidden;z-index:5}
#legendToggle{display:none;width:100%;align-items:center;gap:7px;padding:9px 13px;font-weight:600;font-size:13px;
        letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#legendBody{padding:10px 14px}
#legendBody h3{margin:0 0 6px;font:600 13px "Barlow Condensed","Barlow",sans-serif;letter-spacing:.12em;
        text-transform:uppercase;color:var(--muted)}
#legend label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
#legend input{width:auto;margin:0}
.swatch{width:12px;height:12px;border-radius:50%;flex:none}
.swatch.club{border-radius:2px;transform:rotate(45deg)}

/* ── drawer ── */
#drawer{flex:0 0 min(410px,38%);background:var(--panel);border-left:1px solid var(--line);
        overflow-y:auto;overscroll-behavior:contain;z-index:20;-webkit-overflow-scrolling:touch}
#drawer .head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);
        padding:14px 46px 11px 18px;z-index:2}
#drawer .head h2{margin:0;font:600 24px/1.15 "Barlow Condensed","Barlow",sans-serif}
#drawer .head .call{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--accent);font-weight:600}
#drawer .head .kind{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#closeDrawer{position:absolute;top:10px;right:10px;font-size:19px;line-height:1;padding:6px 10px;border-radius:8px}
#closeDrawer:hover{background:var(--panel2)}
#drawer.empty #closeDrawer{display:none}
#drawer .body{padding:14px 18px 34px;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.field .val{white-space:pre-wrap}
.field .val:empty::after{content:"Not listed yet";color:var(--muted)}

/* logo plate */
.logo{background:var(--plate);border:1px solid var(--line);border-radius:11px;padding:14px;
      display:flex;align-items:center;justify-content:center;min-height:96px}
.logo img{max-height:150px;width:auto;object-fit:contain}

/* repeater card */
.rpt{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel2)}
.rpt .top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rpt .name{font-weight:600}
.rpt .freqs{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px}
.rpt .fq{display:flex;flex-direction:column;line-height:1.25}
.rpt .fq b{font:600 15px "IBM Plex Mono",monospace;letter-spacing:-.01em}
.rpt .fq span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.rpt .rnote{font-size:12.5px;color:var(--muted);margin-top:6px}
.chip{font-size:11px;font-weight:600;letter-spacing:.05em;padding:2px 8px;border-radius:20px;background:var(--chip-bg);color:var(--muted)}
.chip.vhf{color:var(--ok)} .chip.uhf{color:var(--clubs)} .chip.link{color:var(--accent)}
.chip.dig{color:var(--nh)} .chip.six{color:var(--sdlink)}
.chip.own{font-family:"IBM Plex Mono",monospace;letter-spacing:0}
.sitehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 -4px}
.linklike{color:var(--clubs);font-weight:600;padding:0;text-align:left}
.linklike:hover{text-decoration:underline}
.photo{width:100%;border-radius:9px;display:block}
.gallery{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.gallery a{display:block;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.gallery a:hover{border-color:var(--muted)}
.sysnote{font-size:13.5px;color:var(--muted)}
.drawer-note{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:11px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 16px;
      font-size:16.5px;font-weight:600;border-radius:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn.accent{border-color:var(--accent);color:var(--accent);background:transparent;font-weight:700}
.btn.accent:hover{background:var(--accent);color:#fff}
.welcome{font-size:15px;line-height:1.55;background:var(--panel2);border:1px solid var(--line);
         border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px}
.reslist{border-top:1px dashed var(--line);padding-top:14px}
.reslist h4{margin:0 0 10px;font:600 12px "Barlow Condensed","Barlow",sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.resgroup{margin-bottom:12px}
.resgroup h5{margin:0 0 5px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);opacity:.85}
a.res{display:block;padding:6px 0;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.resgroup a.res:last-child{border-bottom:0}
a.res b{display:block;font-weight:600;color:var(--clubs);font-size:14.5px}
a.res-discord b{color:var(--discord);display:flex;align-items:center;gap:7px}
a.res-discord b svg{flex:none}
a.res span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
a.res:hover b{text-decoration:underline}

/* club index */
.clublist{display:flex;flex-direction:column;gap:9px}
.clubrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 11px;
         border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.clubrow:hover{border-color:var(--muted)}
.clubrow .thumb{flex:none;width:52px;height:52px;border-radius:8px;background:var(--plate);
         border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.clubrow .thumb img{max-width:44px;max-height:44px;object-fit:contain}
.clubrow .thumb .ph{font:600 13px "IBM Plex Mono",monospace;color:var(--muted)}
.clubrow .meta{min-width:0}
.clubrow .meta b{display:block;font-weight:600;line-height:1.25}
.clubrow .meta small{color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:12px}

/* ── map marks ── */
.site-dot,.club-dot{stroke:var(--panel);stroke-width:1.6}
.mark{cursor:pointer}
.mark text{font-family:Barlow,sans-serif;font-weight:600;fill:var(--ink);paint-order:stroke;
           stroke:var(--bg);stroke-width:.26em;stroke-linejoin:round}
.mark text.cnum{font-family:Barlow,sans-serif;font-weight:700;fill:#fff;stroke:none;paint-order:normal}
.linkline{fill:none;stroke-width:2.2;stroke-linecap:round;opacity:.85;cursor:pointer}
.linkline.halo{stroke-width:12;opacity:0}
.mark.selected .site-dot,.mark.selected .club-dot{stroke:var(--ink);stroke-width:2.6}
#map .citylabel{font-family:Barlow,sans-serif;font-weight:500;fill:var(--muted);paint-order:stroke;
                stroke:var(--land);stroke-width:.22em;stroke-linejoin:round}
#map .statelabel{font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;
                 fill:var(--land-stroke);opacity:.42;letter-spacing:.35em}

@media (max-width:760px){
  #nav{padding:7px 11px;gap:8px;flex-wrap:nowrap}
  #brand h1{font-size:20px}
  #clubsBtn{padding:8px 12px}
  #brand .sub{display:none}
  #discordBtn{font-size:14px;padding:8px 13px}
  #discordBtn .full{display:none}
  #discordBtn .short{display:inline}
  #drawer{position:absolute;left:0;right:0;bottom:0;top:auto;height:min(70%,560px);width:100%;flex:none;
          border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:var(--shadow);
          transform:translateY(calc(100% + 20px));transition:transform .22s ease}
  #drawer.open{transform:none}
  #drawer .head{border-radius:14px 14px 0 0}
  #legend{left:10px;bottom:10px;max-width:none;font-size:13px}
  #legend:not(.open) #legendBody{display:none}
  #legendToggle{display:flex}
  #zoomctl{right:10px;bottom:10px}
  #zoomctl button{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
</style>
</head>

</nav>

<div id="stage">

      <button id="zin" type="button" aria-label="Zoom in">+</button>
      <button id="zout" type="button" aria-label="Zoom out">−</button>
      <button id="zreset" type="button" aria-label="Reset view" style="font-size:15px">⌂</button>
    </div>
    <div id="legend">
      <button id="legendToggle" type="button" aria-expanded="false">Layers</button>

        <h3>Layers</h3>

  <aside id="drawer" class="empty" aria-live="polite">

      <div class="kind" id="dKind"></div>
      <h2 id="dTitle"></h2>
      <div class="call" id="dCall"></div>
      <button id="closeDrawer" type="button" aria-label="Close panel">✕</button>
    </div>
    <div class="body" id="dBody"></div>
  </aside>

<script>
"use strict";
/* ═══════════════════ data ═══════════════════ */
let state = JSON.parse(document.getElementById('seed').textContent);
const BASE   = JSON.parse(document.getElementById('basemap').textContent);
const CITIES = JSON.parse(document.getElementById('cities').textContent);

// On static hosting (605hams.com) data.json is the source of truth; the embedded
// seed is the offline/preview fallback. Edit data.json to update the map.
const IS_ARTIFACT = !!(window.claude && window.claude.use);
const DATA_PATH = 'data.json';

const SYS = {
  sdlink:{name:'SD-LINK', short:'SD-LINK', color:'var(--sdlink)',
          note:'SD-LINK net every Wednesday at 9:00 PM.'},
  pdarc: {name:'Prairie Dog ARC', short:'PDARC', color:'var(--pdarc)'},
  nh:    {name:'Northern Hills linked system', short:'Northern Hills', color:'var(--nh)',
          note:'Three linked VHF repeaters across the Black Hills. They are not tied into SD-LINK full time; '
             + 'the system links in for the SD-LINK net on Wednesdays at 9:00 PM, then drops back off.'},
  none:  {name:'Independent / club', short:'Independent', color:'var(--indep)'}
};
const sysOf = k => SYS[k] || SYS.none;
const layers = {clubs:true, sdlink:true, pdarc:true, nh:true, none:true};
let selected = null;

const esc = s => String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ═══════════════════ polyline decode ═══════════════════ */
function decode(str){
  const pts=[]; let i=0, lat=0, lon=0;
  while(i<str.length){
    let r=0, sh=0, b;
    do{ b=str.charCodeAt(i++)-63; r|=(b&0x1f)<<sh; sh+=5; }while(b>=0x20);
    lat += (r&1)?~(r>>1):(r>>1);
    r=0; sh=0;
    do{ b=str.charCodeAt(i++)-63; r|=(b&0x1f)<<sh; sh+=5; }while(b>=0x20);
    lon += (r&1)?~(r>>1):(r>>1);
    pts.push([lat/1000, lon/1000]);
  }
  return pts;
}
const GEO = {};
for(const k in BASE) GEO[k] = BASE[k].map(decode);

/* ═══════════════════ projection ═══════════════════ */
// Equirectangular with a cos(lat) correction at the state's mid-latitude.
const PAD = 0.10;                       // degrees of breathing room
let LON0=0, LON1=0, LAT0=0, LAT1=0, K=1, S=1, W=1000, H=700;
(function bounds(){
  let n=-90,s=90,e=-180,w=180;
  for(const p of GEO.state[0]){ if(p[0]>n)n=p[0]; if(p[0]<s)s=p[0]; if(p[1]>e)e=p[1]; if(p[1]<w)w=p[1]; }
  LAT1=n+PAD; LAT0=s-PAD; LON0=w-PAD; LON1=e+PAD;
  K = Math.cos((LAT0+LAT1)/2*Math.PI/180);
  S = W/((LON1-LON0)*K);
  H = (LAT1-LAT0)*S;
})();
const px  = (lat,lon)=>[(lon-LON0)*K*S, (LAT1-lat)*S];
const path = a => { let d=''; for(let i=0;i<a.length;i++){ const p=px(a[i][0],a[i][1]);
  d += (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); } return d; };

/* ═══════════════════ view / zoom / pan ═══════════════════ */
const svg = document.getElementById('map');
const mapwrap = document.getElementById('mapwrap');
let baseView = {x:0,y:0,w:W,h:H};      // the "fit the whole state" viewBox for this container
let view = {x:0,y:0,w:W,h:H}, zoom = 1;

function computeBase(){
  const r = mapwrap.getBoundingClientRect();
  const ar = (r.width||1)/(r.height||1);
  let w=W, h=H;
  if(ar > W/H){ h=H; w=H*ar; } else { w=W; h=W/ar; }
  const m = Math.min(w,h)*0.03;         // small inset so markers near the edge aren't clipped
  w+=m*ar; h+=m;
  // On a tall, narrow screen the state letterboxes badly; sit it high so the
  // bottom sheet does not cover it.
  const vAnchor = ar < 0.95 ? 0.34 : 0.5;
  baseView = {x:(W-w)/2, y:(H-h)*vAnchor, w, h};
}
function screenScale(){ const m=svg.getScreenCTM(); return m?m.a:1; }
function clampView(x,y){
  const sx = baseView.w - view.w, sy = baseView.h - view.h;   // slack at this zoom
  return [Math.min(Math.max(x, baseView.x), baseView.x+sx),
          Math.min(Math.max(y, baseView.y), baseView.y+sy)];
}
function applyView(){ svg.setAttribute('viewBox', view.x+' '+view.y+' '+view.w+' '+view.h); }
function setView(x,y){ const c=clampView(x,y); view.x=c[0]; view.y=c[1]; applyView(); }
function setZoom(z,cx,cy){
  z = Math.min(14, Math.max(1, z));
  const w = baseView.w/z, h = baseView.h/z;
  const x = cx-(cx-view.x)*(w/view.w), y = cy-(cy-view.y)*(h/view.h);
  const changed = Math.abs(z-zoom) > 1e-9;
  view.w=w; view.h=h; zoom=z; setView(x,y);
  if(changed) drawBase(), render();
}
function resetView(){
  computeUI(); computeBase(); zoom=1; view={x:baseView.x,y:baseView.y,w:baseView.w,h:baseView.h};
  applyView(); drawBase(); render();
}

/* ═══════════════════ basemap ═══════════════════ */
let cityObstacles = [];
const ramp = (z,a,b)=> Math.max(0, Math.min(1, (z-a)/(b-a)));

// Marker and label sizes, in CSS pixels. Everything on the map scales off these.
const R_SITE = 9, R_CLUSTER = 15, R_CLUB = 7, LBL = 15, CITY = 12.5, MERGE = 21;

// Nudge the whole marker UI with the rendered width of the map, but never let it
// get small enough to squint at.
let UI = 1;
function computeUI(){
  const w = mapwrap.getBoundingClientRect().width || 1000;
  UI = Math.max(0.88, Math.min(1.15, w/1250));
}

// Every club/site position in map units; city labels step aside for these.
function markerPoints(){
  const out=[];
  for(const s of state.sites) out.push(px(s.lat,s.lon));
  for(const c of state.clubs) out.push(px(c.lat,c.lon));
  return out;
}

function drawBase(){
  const sc = 1/(screenScale()||1);          // map units per CSS pixel
  const cty = ramp(zoom,1.25,2.1);          // county lines fade in
  let g = '<g id="base">';

  g += '<path d="'+path(GEO.state[0])+'Z" fill="var(--land)" stroke="var(--land-stroke)" '
     + 'stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';

  if(cty > 0.01){
    g += '<g opacity="'+cty.toFixed(2)+'" fill="none" stroke="var(--county)" stroke-width="1" '
       + 'vector-effect="non-scaling-stroke">';
    for(const l of GEO.counties) g += '<path d="'+path(l)+'"/>';
    g += '</g>';
  }
  for(const l of GEO.lakes)
    g += '<path d="'+path(l)+'Z" fill="var(--water)" stroke="var(--water-line)" stroke-width="1" '
       + 'vector-effect="non-scaling-stroke"/>';
  g += '<g fill="none" stroke="var(--water-line)" stroke-width="1.6" vector-effect="non-scaling-stroke" '
     + 'stroke-linecap="round" stroke-linejoin="round">';
  for(const l of GEO.rivers) g += '<path d="'+path(l)+'"/>';
  g += '</g>';
  g += '<g fill="none" stroke="var(--road)" stroke-width="1.8" stroke-dasharray="7 5" '
     + 'vector-effect="non-scaling-stroke" stroke-linecap="round">';
  for(const l of (GEO.i90||[])) g += '<path d="'+path(l)+'"/>';
  for(const l of (GEO.i29||[])) g += '<path d="'+path(l)+'"/>';
  g += '</g>';

  // state watermark, tamed as you zoom in
  if(zoom < 3){
    const p = px(45.68,-100.25);
    const wm = (mapwrap.getBoundingClientRect().width||1000)*0.035*sc;  // fixed CSS size
    g += '<text class="statelabel" x="'+p[0].toFixed(1)+'" y="'+p[1].toFixed(1)+'" '
       + 'style="font-size:'+wm.toFixed(1)+'px;opacity:'+(0.42*(1-ramp(zoom,2,3))).toFixed(2)
       + '" text-anchor="middle">SOUTH DAKOTA</text>';
  }

  // cities, tiered by zoom; they double as label obstacles for the markers
  const maxTier = zoom>=2.8 ? 3 : zoom>=1.6 ? 2 : 1;
  const cityPx = CITY*Math.pow(zoom,0.2)*UI;   // CSS pixels
  const fs = cityPx*sc;                        // …expressed in map units
  const marks = markerPoints();
  const near = 17*sc*UI;                       // a marker this close owns the spot
  cityObstacles = [];
  for(const c of CITIES){
    if(c[3] > maxTier) continue;
    const p = px(c[1],c[2]), x=p[0], y=p[1];
    g += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(2.4*sc*UI).toFixed(2)+'" fill="var(--land-stroke)"/>';
    cityObstacles.push([x-3*sc, y-3*sc, 6*sc, 6*sc]);
    let taken=false;
    for(const m of marks){ if(Math.hypot(m[0]-x, m[1]-y) < near){ taken=true; break; } }
    if(taken) continue;
    g += '<text class="citylabel" style="font-size:'+fs.toFixed(2)+'px" x="'+(x+5.5*sc*UI).toFixed(1)
       + '" y="'+(y+3.8*sc*UI).toFixed(1)+'">'+esc(c[0])+'</text>';
    cityObstacles.push([x+5.5*sc*UI, y-6*sc*UI, (c[0].length*0.56+1)*cityPx*sc, 13*sc*UI]);
  }
  g += '</g><g id="glinks"></g><g id="gmarks"></g>';
  svg.innerHTML = g;
}

/* ═══════════════════ label placement ═══════════════════ */
function overlapArea(a,b){
  const w=Math.min(a[0]+a[2],b[0]+b[2])-Math.max(a[0],b[0]);
  const h=Math.min(a[1]+a[3],b[1]+b[3])-Math.max(a[1],b[1]);
  return (w>0&&h>0)?w*h:0;
}
function placeLabel(x,y,text,pref,obstacles,sc,g){
  const w=(text.length*7.5+8)*g, h=17*g;
  const inset=6*sc;
  const FRAME=[view.x+inset, view.y+inset, view.w-2*inset, view.h-2*inset];
  const C=(dir,tx,ty,anchor)=>{
    const bx = anchor==='middle'?tx-w/2 : anchor==='start'?tx-1 : tx-w+1;
    return {dir,tx,ty,anchor,box:[x+bx*sc, y+(ty-11*g)*sc, w*sc, h*sc]};
  };
  const above=C('above',0,-20*g,'middle'), below=C('below',0,26*g,'middle');
  const right=C('right',16*g,5*g,'start'), left=C('left',-16*g,5*g,'end');
  const diag=[C('right',15*g,-13*g,'start'),C('right',15*g,21*g,'start'),
              C('left',-15*g,-13*g,'end'),C('left',-15*g,21*g,'end')];
  // a second, wider ring so crowded corners still find somewhere clean to sit
  const far=[C('above',0,-36*g,'middle'),C('below',0,42*g,'middle'),
             C('right',30*g,5*g,'start'),C('left',-30*g,5*g,'end'),
             C('right',26*g,-24*g,'start'),C('right',26*g,32*g,'start'),
             C('left',-26*g,-24*g,'end'),C('left',-26*g,32*g,'end')];
  const cands=(pref==='above'?[above,below,right,left]:[below,above,right,left]).concat(diag,far);
  let best=cands[0], bestA=Infinity;
  for(const c of cands){
    let a=0;
    for(const o of obstacles) a+=overlapArea(c.box,o);
    a += (c.box[2]*c.box[3]-overlapArea(c.box,FRAME))*4;   // heavy penalty for leaving the frame
    if(a===0){ best=c; bestA=0; break; }
    if(a<bestA){ best=c; bestA=a; }
  }
  best.hide = bestA/(sc*sc) > 60;
  if(!best.hide) obstacles.push(best.box);
  return best;
}
const STEMS={above:[0,-9,0,-15], below:[0,9,0,15], right:[9,0,15,0], left:[-9,0,-15,0]};

/* ═══════════════════ markers ═══════════════════ */
const site = id => state.sites.find(s=>s.id===id);
const club = id => state.clubs.find(c=>c.id===id);
let lastClusters=[];
const clusterKey = m => m.map(s=>s.id).sort().join('|');

function render(){
  const sc = (1/(screenScale()||1))*UI, lg = Math.pow(zoom,0.16)*UI;
  const fs = ' style="font-size:'+(LBL*Math.pow(zoom,0.16)*UI).toFixed(2)+'px"';
  // dots grow gently with zoom, same curve as the labels
  const dg = Math.pow(zoom,0.16);
  const RS = R_SITE*dg, RC = R_CLUSTER*dg, RB = R_CLUB*dg;
  const visSites = state.sites.filter(s=>layers[s.system||'none']);
  const visClubs = layers.clubs ? state.clubs : [];

  // group sites that sit on top of each other at this zoom
  const thresh = MERGE*sc, clusters=[];
  for(const s of visSites){
    const p = px(s.lat,s.lon);
    const c = clusters.find(c=>Math.hypot(c.x-p[0], c.y-p[1]) < thresh);
    if(c){
      c.members.push(s);
      c.x = c.members.reduce((t,m)=>t+px(m.lat,m.lon)[0],0)/c.members.length;
      c.y = c.members.reduce((t,m)=>t+px(m.lat,m.lon)[1],0)/c.members.length;
    } else clusters.push({x:p[0], y:p[1], members:[s]});
  }
  lastClusters = clusters;
  const pos={};
  for(const c of clusters) for(const m of c.members) pos[m.id]=[c.x,c.y];

  // links
  let lh='';
  state.links.forEach((L,i)=>{
    if(!layers[L.system||'none'] || !pos[L.a] || !pos[L.b]) return;
    const a=pos[L.a], b=pos[L.b];
    if(Math.hypot(a[0]-b[0], a[1]-b[1]) < 1) return;
    const col = sysOf(L.system).color;
    const sel = selected && selected.type==='link' && selected.id===i;
    const xy = 'x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"';
    lh += '<line class="linkline halo" data-link="'+i+'" vector-effect="non-scaling-stroke" '+xy+' stroke="'+col+'"/>'
        + '<line class="linkline" data-link="'+i+'" vector-effect="non-scaling-stroke" '+xy+' stroke="'+col+'"'
        + (sel?' stroke-width="4.5" opacity="1"':'')+'/>';
  });
  document.getElementById('glinks').innerHTML = lh;

  // obstacles: city labels first, then every dot, then labels greedily
  const obstacles = cityObstacles.slice();
  for(const c of clusters){
    const r = c.members.length>1 ? RC+2 : RS+2;
    obstacles.push([c.x-r*sc, c.y-(r+6)*sc, 2*r*sc, (2*r+6)*sc]);
  }
  for(const c of visClubs){ const p=px(c.lat,c.lon); obstacles.push([p[0]-(RB+2)*sc, p[1]-(RB+2)*sc, (RB+2)*2*sc, (RB+2)*2*sc]); }

  let mh='';
  clusters.forEach((c,ci)=>{
    const tr = ' transform="translate('+c.x+','+c.y+') scale('+sc+')"';
    if(c.members.length===1){
      const s=c.members[0], col=sysOf(s.system).color;
      const sel = selected && selected.type==='site' && selected.id===s.id;
      const L = placeLabel(c.x,c.y,s.name,'above',obstacles,sc,lg), st=STEMS[L.dir].map(v=>(v*dg).toFixed(1));
      mh += '<g class="mark'+(sel?' selected':'')+'" data-site="'+s.id+'" tabindex="0" role="button" aria-label="'
          + esc(s.name)+' repeater site"'+tr+'>'
          + '<circle class="site-dot" r="'+RS.toFixed(1)+'" fill="'+col+'"/>'
          + (L.hide ? '' :
              '<line x1="'+st[0]+'" y1="'+st[1]+'" x2="'+st[2]+'" y2="'+st[3]+'" stroke="'+col+'" stroke-width="2"/>'
            + '<text'+fs+' x="'+L.tx.toFixed(1)+'" y="'+L.ty.toFixed(1)+'" text-anchor="'+L.anchor+'">'+esc(s.name)+'</text>')
          + '</g>';
    } else {
      const systems=[...new Set(c.members.map(m=>m.system||'none'))];
      const col = systems.length===1 ? sysOf(systems[0]).color : 'var(--indep)';
      const label = c.members[0].name+' +'+(c.members.length-1);
      const sel = selected && selected.type==='cluster' && selected.key===clusterKey(c.members);
      const L = placeLabel(c.x,c.y,label,'above',obstacles,sc,lg);
      mh += '<g class="mark'+(sel?' selected':'')+'" data-cluster="'+ci+'" tabindex="0" role="button" aria-label="'
          + esc(label)+', '+c.members.length+' repeater sites"'+tr+'>'
          + '<circle class="site-dot" r="'+RC.toFixed(1)+'" fill="'+col+'"/>'
          + '<text class="cnum" y="'+(5.5*dg).toFixed(1)+'" text-anchor="middle" style="font-size:'+(15*dg).toFixed(1)+'px">'+c.members.length+'</text>'
          + (L.hide ? '' : '<text'+fs+' x="'+L.tx.toFixed(1)+'" y="'+L.ty.toFixed(1)+'" text-anchor="'+L.anchor+'">'+esc(label)+'</text>')
          + '</g>';
    }
  });
  for(const c of visClubs){
    const p=px(c.lat,c.lon);
    const sel = selected && selected.type==='club' && selected.id===c.id;
    const L = placeLabel(p[0],p[1],c.callsign,'below',obstacles,sc,lg);
    mh += '<g class="mark'+(sel?' selected':'')+'" data-club="'+c.id+'" tabindex="0" role="button" aria-label="'
        + esc(c.name)+'" transform="translate('+p[0]+','+p[1]+') scale('+sc+')">'
        + '<rect class="club-dot" x="'+(-RB).toFixed(1)+'" y="'+(-RB).toFixed(1)+'" width="'+(RB*2).toFixed(1)+'" height="'+(RB*2).toFixed(1)+'" rx="'+(2.5*dg).toFixed(1)+'" transform="rotate(45)" fill="var(--clubs)"/>'
        + (L.hide ? '' : '<text'+fs+' x="'+L.tx.toFixed(1)+'" y="'+L.ty.toFixed(1)+'" text-anchor="'+L.anchor+'">'+esc(c.callsign)+'</text>')
        + '</g>';
  }
  document.getElementById('gmarks').innerHTML = mh;
}

// Other South Dakota radio projects worth knowing about, from data.json.
function resourceList(){
  const groups = state.resources || [];
  if(!groups.length) return '';
  return '<div class="reslist"><h4>Elsewhere in South Dakota radio</h4>'
    + groups.map(g =>
        '<div class="resgroup"><h5>'+esc(g.group)+'</h5>'
      + (g.items||[]).map(i =>
          '<a class="res'+(i.discord?' res-discord':'')+'" href="'+esc(i.url)+'" target="_blank" rel="noopener">'

      + '</div>').join('')
    + '</div>';
}

// Only linkify a value that actually is one. Prose like "reach out to the club
// through its website" was rendering blue and pointing at a nonsense URL.
const isUrlish = v => /^https?:\/\//i.test(v)
  || /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)
  || /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v);
function field(lab,val,link){
  let v=esc(val);
  const t=(val||'').trim();
  if(link && t && isUrlish(t)){
    const href = /^https?:/i.test(t) ? t
               : (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t) ? 'mailto:'+t : 'https://'+t);
    v='<a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(t)+'</a>';
  }
  return '<div class="field"><label>'+lab+'</label><div class="val">'+v+'</div></div>';
}
function chipFor(t){
  t=(t||'').toLowerCase();
  if(t.includes('digital')||t.includes('fusion')||t.includes('star')) return '<span class="chip dig">DIGITAL</span>';
  if(t.includes('link')) return '<span class="chip link">LINK</span>';
  if(t.includes('6 m')||t.includes('6m')) return '<span class="chip six">6 M</span>';
  if(t.includes('220')||t.includes('1.25')) return '<span class="chip six">1.25 M</span>';
  if(t.includes('vhf')) return '<span class="chip vhf">VHF</span>';
  if(t.includes('uhf')) return '<span class="chip uhf">UHF</span>';
  return '<span class="chip">'+esc((t||'rpt').toUpperCase())+'</span>';
}
function rptView(r){
  let s='<div class="rpt"><div class="top"><span class="name">'+esc(r.label)+'</span>'+chipFor(r.type)
      + (r.owner?'<span class="chip own">'+esc(r.owner)+'</span>':'')+'</div>';
  const cells=[];
  if(r.out) cells.push('<div class="fq"><b>'+esc(r.out)+'</b><span>Listen on</span></div>');
  if(r['in']) cells.push('<div class="fq"><b>'+esc(r['in'])+'</b><span>Transmit on</span></div>');
  if(r.tone) cells.push('<div class="fq"><b>'+esc(r.tone)+'</b><span>Tone</span></div>');
  s += cells.length ? '<div class="freqs">'+cells.join('')+'</div>'
                    : '<div class="rnote">Frequency not published yet.</div>';
  if(r.note) s+='<div class="rnote">'+esc(r.note)+'</div>';
  return s+'</div>';
}

// Backbone link pairs are deliberately not published; nobody should key up on one.
function rptList(reps){
  reps = reps||[];
  if(!reps.length) return '<div class="sysnote">No repeater here that you can work directly.</div>';
  return reps.map(rptView).join('');
}

function openClub(id){

  selected={type:'club',id}; openDrawer();
  dKind.textContent='Amateur Radio Club';
  dTitle.textContent=c.name;
  dCall.textContent=c.callsign+' · '+c.city;
  const dUrl = c.discord ? (/^https?:/i.test(c.discord)?c.discord:'https://'+c.discord) : '';
  dBody.innerHTML =
    (c.logo ? '<div class="logo"><img src="'+esc(c.logo)+'" alt="'+esc(c.name)+' logo" loading="lazy" onerror="this.parentNode.remove()"></div>' : '')
  + field('Meetings', c.meeting)
  + (c.address ? '<div class="field"><label>Where</label><div class="val">'+esc(c.address)+'</div>'
      + '<a class="btn maps small" style="margin-top:8px" href="https://www.google.com/maps/search/?api=1&amp;query='
      + encodeURIComponent(c.address)+'" target="_blank" rel="noopener">'+mapsSvg()+'Open in Google Maps</a></div>' : '')
  + field('Mailing list', c.mailing, true)
  + field('Website', c.website, true)
  + (dUrl ? '<div class="field"><label>Club Discord</label><a class="btn discord small" style="display:inline-flex;margin-top:3px" href="'
          + esc(dUrl)+'" target="_blank" rel="noopener">'+discordSvg(15)+'Join the club Discord</a></div>' : '')
  + '<div class="drawer-note">Coordinates '+c.lat.toFixed(4)+', '+c.lon.toFixed(4)
  + ' · <button class="linklike" type="button" id="backToClubs">All clubs</button></div>';
  const b=document.getElementById('backToClubs'); if(b) b.onclick=openClubIndex;

}

function openSite(id){
  const s=site(id); if(!s) return;
  selected={type:'site',id}; openDrawer();
  const sys=sysOf(s.system);
  dKind.textContent=(s.system && s.system!=='none') ? sys.short+' repeater site' : 'Repeater site';
  dTitle.textContent=s.name; dCall.textContent='';
  dBody.innerHTML =
    rptList(s.repeaters)
  + (sys.note ? '<div class="sysnote">'+esc(sys.note)+'</div>' : '')
  + (s.notes ? field('Notes', s.notes) : '')
  + ((s.photos||[]).length
      ? '<div class="field"><label>Site photos</label><div class="gallery">'
        + s.photos.map(ph=>'<a href="'+esc(ph)+'" target="_blank" rel="noopener">'
            + '<img class="photo" src="'+esc(ph)+'" alt="'+esc(s.name)+' site photo" loading="lazy" onerror="this.closest(\'a\').remove()"></a>').join('')
        + '</div></div>'
      : '')
  + '<div class="drawer-note">Coordinates '+s.lat.toFixed(4)+', '+s.lon.toFixed(4)+'</div>';
  render();
}

function openCluster(ci){
  const c=lastClusters[ci]; if(!c) return;
  selected={type:'cluster',key:clusterKey(c.members)}; openDrawer();
  dKind.textContent=c.members.length+' repeater sites';
  dTitle.textContent=c.members[0].name+' area'; dCall.textContent='';
  dBody.innerHTML = c.members.map(m=>{
    const sys=sysOf(m.system);
    return '<div class="sitehead"><button class="linklike" type="button" data-open-site="'+m.id+'">'+esc(m.name)+'</button>'
         + '<span class="chip" style="color:'+sys.color+'">'+esc(sys.short)+'</span></div>'
         + rptList(m.repeaters);
  }).join('')
  + '<div class="drawer-note">These sites sit close together on the map. Zoom in to separate them, or click a site name for its details.</div>';
  dBody.querySelectorAll('[data-open-site]').forEach(b=>b.onclick=()=>openSite(b.getAttribute('data-open-site')));
  render();
}

function openLink(i){
  const L=state.links[i]; if(!L) return;
  selected={type:'link',id:i}; openDrawer();
  const a=site(L.a), b=site(L.b), sys=sysOf(L.system);
  dKind.textContent='Repeater link';
  dTitle.textContent=(a?a.name:'?')+' ⌁ '+(b?b.name:'?');
  dCall.textContent=sys.name;
  dBody.innerHTML='<div class="sysnote">These two sites are joined by an RF link in the '+esc(sys.name)
    +'. Use the repeater at either end to get into the system.</div>'
    + (sys.note?'<div class="sysnote">'+esc(sys.note)+'</div>':'')
    + '<div class="sitehead"><button class="linklike" type="button" data-go="'+esc(L.a)+'">'+esc(a?a.name:'?')+'</button></div>'
    + '<div class="sitehead"><button class="linklike" type="button" data-go="'+esc(L.b)+'">'+esc(b?b.name:'?')+'</button></div>';
  dBody.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openSite(b.getAttribute('data-go')));
  render();
}

function openClubIndex(){
  selected=null; openDrawer();
  dKind.textContent='South Dakota';
  dTitle.textContent='Amateur radio clubs'; dCall.textContent=state.clubs.length+' clubs';

document.getElementById('clubsBtn').onclick = openClubIndex;

/* ═══════════════════ interaction ═══════════════════ */
function svgPoint(ev){
  const pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  return [p.x,p.y];
}
function openMark(g){
  if(g.hasAttribute('data-site')) openSite(g.getAttribute('data-site'));
  else if(g.hasAttribute('data-club')) openClub(g.getAttribute('data-club'));
  else if(g.hasAttribute('data-cluster')) openCluster(+g.getAttribute('data-cluster'));
}
let justDragged=false, pan=null, pinch=null;
const ptrs=new Map();

svg.addEventListener('pointerdown',ev=>{
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(ptrs.size===2){
    pan=null;
    const v=[...ptrs.values()];
    pinch={d:Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y)};
    for(const id of ptrs.keys()){ try{ svg.setPointerCapture(id); }catch(e){} }
    return;
  }
  pan={sx:ev.clientX, sy:ev.clientY, vx:view.x, vy:view.y, scale:svg.getScreenCTM().a, moved:false,
       hit:ev.target.closest('.mark')};
});
svg.addEventListener('pointermove',ev=>{
  const p=ptrs.get(ev.pointerId); if(p){ p.x=ev.clientX; p.y=ev.clientY; }
  if(pinch && ptrs.size===2){
    const v=[...ptrs.values()], d=Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y);
    if(d>0 && pinch.d>0){
      const pt=svg.createSVGPoint(); pt.x=(v[0].x+v[1].x)/2; pt.y=(v[0].y+v[1].y)/2;
      const m=pt.matrixTransform(svg.getScreenCTM().inverse());
      setZoom(zoom*d/pinch.d, m.x, m.y);
    }
    pinch.d=d; return;
  }
  if(pan){
    if(!pan.moved && Math.hypot(ev.clientX-pan.sx, ev.clientY-pan.sy)<5) return;
    if(!pan.moved){ try{ svg.setPointerCapture(ev.pointerId); }catch(e){} }
    pan.moved=true;
    setView(pan.vx-(ev.clientX-pan.sx)/pan.scale, pan.vy-(ev.clientY-pan.sy)/pan.scale);
  }
});
svg.addEventListener('pointerup',ev=>{
  ptrs.delete(ev.pointerId);
  if(pinch){ if(ptrs.size<2){ pinch=null; justDragged=true; } return; }
  if(!pan) return;
  const p=pan; pan=null;
  if(p.moved){ justDragged=true; return; }
  if(p.hit) openMark(p.hit);
});
svg.addEventListener('pointercancel',ev=>{ ptrs.delete(ev.pointerId); pinch=null; pan=null; });
svg.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const m=svgPoint(ev);
  setZoom(zoom*(ev.deltaY<0?1.25:0.8), m[0], m[1]);
},{passive:false});
svg.addEventListener('click',ev=>{
  if(justDragged){ justDragged=false; return; }
  const ln=ev.target.closest('.linkline');
  if(ln){ openLink(+ln.getAttribute('data-link')); return; }
  if(ev.target.closest('.mark')) return;
  closeDrawer();
});
svg.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter' && ev.key!==' ') return;
  const g=ev.target.closest && ev.target.closest('.mark'); if(!g) return;
  ev.preventDefault(); openMark(g);
});
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape') closeDrawer(); });

const ctr=()=>[view.x+view.w/2, view.y+view.h/2];
document.getElementById('zin').onclick  = ()=>{ const c=ctr(); setZoom(zoom*1.5, c[0], c[1]); };
document.getElementById('zout').onclick = ()=>{ const c=ctr(); setZoom(zoom/1.5, c[0], c[1]); };
document.getElementById('zreset').onclick = resetView;

document.querySelectorAll('#legend [data-layer]').forEach(cb=>cb.addEventListener('change',()=>{
  layers[cb.getAttribute('data-layer')]=cb.checked; render();
}));
const lt=document.getElementById('legendToggle'), lg=document.getElementById('legend');
lt.onclick=()=>{ const o=lg.classList.toggle('open'); lt.setAttribute('aria-expanded', o?'true':'false'); };

/* ═══════════════════ nav ═══════════════════ */
const discordBtn=document.getElementById('discordBtn');
function syncDiscord(){
  const u=discordUrl();
  discordBtn.href=u||'#';
  discordBtn.style.display=u?'inline-flex':'none';
  const lab=(state.discord&&state.discord.label)||'Join the SD Ham Discord';
  discordBtn.querySelector('.full').textContent=lab;
}

/* ═══════════════════ boot ═══════════════════ */
let raf=0;
new ResizeObserver(()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{
  const z=zoom, cx=view.x+view.w/2, cy=view.y+view.h/2;
  computeUI(); computeBase();
  view.w=baseView.w/z; view.h=baseView.h/z;
  setView(cx-view.w/2, cy-view.h/2);
  drawBase(); render();
}); }).observe(mapwrap);

if(!IS_ARTIFACT){
  fetch(DATA_PATH+'?v='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d && d.clubs && d.sites){ state=d; render(); syncDiscord(); } })
    .catch(()=>{});
}
resetView();
renderEmptyDrawer();
syncDiscord();

</script>
